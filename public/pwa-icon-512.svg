<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="108" fill="#020617"/>
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Border Frame -->
  <rect x="16" y="16" width="480" height="480" rx="92" fill="none" stroke="url(#goldGrad)" stroke-width="8" opacity="0.6"/>

  <!-- Golden Letter H -->
  <path d="M 120 120 L 175 120 L 175 225 L 337 225 L 337 120 L 392 120 L 392 392 L 337 392 L 337 285 L 175 285 L 175 392 L 120 392 Z" fill="url(#goldGrad)" filter="url(#glow)"/>

  <!-- Candlesticks overlay -->
  <rect x="230" y="160" width="16" height="180" fill="url(#emeraldGrad)" rx="4"/>
  <line x1="238" y1="130" x2="238" y2="370" stroke="#10b981" stroke-width="6"/>

  <rect x="270" y="190" width="16" height="130" fill="url(#emeraldGrad)" rx="4"/>
  <line x1="278" y1="170" x2="278" y2="330" stroke="#10b981" stroke-width="6"/>
</svg>
